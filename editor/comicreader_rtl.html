<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫画阅读器 | 梅林档案馆</title>

<!-- 引入字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-main: #121212;         /* 暗色背景沉浸体验 */
    --panel-bg: rgba(26, 26, 26, 0.95);
    --text-primary: #e0e0e0;
    --accent-color: #b58d59;     /* 典雅金色/棕色 */
    --border-color: #333333;
    --reader-max-width: 900px;   /* 漫画标准显示宽度 */
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none; /* 防止双击选中文本或图片 */
}

body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

/* 顶部与底部悬浮控制栏 */
.reader-bar {
    position: fixed;
    left: 0;
    width: 100%;
    background-color: var(--panel-bg);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    border-color: var(--border-color);
    transition: transform 0.3s ease, opacity 0.3s ease;
}

.reader-header {
    top: 0;
    border-bottom: 1px solid var(--border-color);
}

.reader-footer {
    bottom: 0;
    border-top: 1px solid var(--border-color);
}

/* 隐藏控制栏的类 */
.bar-hidden .reader-header {
    transform: translateY(-100%);
    opacity: 0;
}
.bar-hidden .reader-footer {
    transform: translateY(100%);
    opacity: 0;
}

.comic-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
}

.comic-title a {
    color: var(--accent-color);
    text-decoration: none;
    font-size: 13px;
}

.controls-group {
    display: flex;
    align-items: center;
    gap: 10px;
}

button, select {
    background: #2a2a2a;
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12.5px;
    font-family: inherit;
    transition: all 0.2s ease;
}

button:hover, select:hover {
    border-color: var(--accent-color);
    color: var(--accent-color);
}

/* 漫画主展示区 */
main.comic-container {
    width: 100%;
    max-width: var(--reader-max-width);
    flex: 1;
    margin-top: 50px;
    margin-bottom: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: calc(100vh - 100px);
}

/* 模式 1：条漫/连续向下卷轴 */
main.mode-scroll .comic-page {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    vertical-align: bottom; /* 清除图片间缝隙 */
}

/* 模式 2：单页翻页模式 */
main.mode-page {
    justify-content: center;
}

main.mode-page .comic-page {
    max-width: 100%;
    max-height: calc(100vh - 120px);
    width: auto;
    height: auto;
    object-fit: contain;
    display: none;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

main.mode-page .comic-page.active {
    display: block;
}

/* 点击翻页热区（仅在翻页模式生效） */
.click-zone {
    position: fixed;
    top: 50px;
    bottom: 50px;
    width: 38%;
    z-index: 10;
    cursor: pointer;
    display: none;
}
.click-zone.left { left: 0; }
.click-zone.right { right: 0; }

main.mode-page ~ .click-zone {
    display: block;
}

/* 进度条 */
.progress-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: transparent;
    z-index: 101;
}

.progress-bar {
    height: 100%;
    background: var(--accent-color);
    width: 0%;
    transition: width 0.1s ease;
}

/* 进度条 RTL 支持（右向左翻页时，进度条从右向左增长） */
body.dir-rtl .progress-container {
    transform: rotateY(180deg);
}

/* 页码计数器 */
.page-counter {
    font-size: 13px;
    color: #888;
}

/* Toast 提示框 */
.toast {
    position: fixed;
    top: 70px;
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 200;
}
</style>
</head>

<body class="dir-ltr">

  <!-- 顶部进度条 -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- 1. 顶部控制栏 -->
  <header class="reader-bar reader-header">
    <div class="comic-title">
      <a href="#">← 目录</a>
      <span>沃德兰的守夜人 - 第一话</span>
    </div>
    
    <div class="controls-group">
      <!-- 翻页方向选择器 -->
      <select id="dirSelect" onchange="switchDirection(this.value)">
        <option value="ltr">左 → 右（国漫/美漫）</option>
        <option value="rtl">右 → 左（日漫习惯）</option>
      </select>

      <!-- 阅读模式选择器 -->
      <select id="modeSelect" onchange="switchMode(this.value)">
        <option value="scroll">条漫/卷轴模式</option>
        <option value="page">单页/翻页模式</option>
      </select>

      <button onclick="toggleFullscreen()">全屏</button>
    </div>
  </header>

  <!-- 2. 漫画图片容器 -->
  <main class="comic-container mode-scroll" id="comicContainer" onclick="handleContainerClick(event)">
    <img class="comic-page" src="https://picsum.photos/800/1200?random=1" alt="Page 1" loading="lazy">
    <img class="comic-page" src="https://picsum.photos/800/1200?random=2" alt="Page 2" loading="lazy">
    <img class="comic-page" src="https://picsum.photos/800/1200?random=3" alt="Page 3" loading="lazy">
    <img class="comic-page" src="https://picsum.photos/800/1200?random=4" alt="Page 4" loading="lazy">
    <img class="comic-page" src="https://picsum.photos/800/1200?random=5" alt="Page 5" loading="lazy">
  </main>

  <!-- 翻页模式两侧点击热区 -->
  <div class="click-zone left" onclick="handleZoneClick('left')"></div>
  <div class="click-zone right" onclick="handleZoneClick('right')"></div>

  <!-- 3. 底部控制栏 -->
  <footer class="reader-bar reader-footer">
    <div class="page-counter">
      页码：<span id="currentPageNum">1</span> / <span id="totalPagesNum">0</span>
    </div>

    <div class="controls-group">
      <button id="btnPrev" onclick="prevPage()">上一页</button>
      <button id="btnNext" onclick="nextPage()">下一页</button>
    </div>
  </footer>

  <!-- Toast 提示框 -->
  <div class="toast" id="toast"></div>

<script>
  // 配置项：如果你想让某个作品固定默认“右向左”，只需修改 defaultDirection
  const CONFIG = {
      defaultDirection: 'ltr', // 'ltr' (从左往右) 或 'rtl' (从右往左)
      defaultMode: 'scroll'     // 'scroll' 或 'page'
  };

  // 状态变量
  let currentPage = 1;
  let totalPages = 0;
  let currentMode = CONFIG.defaultMode;
  let currentDir = CONFIG.defaultDirection;
  let barsVisible = true;

  const container = document.getElementById('comicContainer');
  const pages = document.querySelectorAll('.comic-page');
  const pageNumSpan = document.getElementById('currentPageNum');
  const totalNumSpan = document.getElementById('totalPagesNum');
  const progressBar = document.getElementById('progressBar');
  const modeSelect = document.getElementById('modeSelect');
  const dirSelect = document.getElementById('dirSelect');

  // 初始化
  window.addEventListener('DOMContentLoaded', () => {
      totalPages = pages.length;
      totalNumSpan.textContent = totalPages;

      // 允许读取上一次记忆（或者使用 CONFIG 设置）
      const savedMode = localStorage.getItem('comic-mode') || CONFIG.defaultMode;
      const savedDir = localStorage.getItem('comic-dir') || CONFIG.defaultDirection;

      modeSelect.value = savedMode;
      dirSelect.value = savedDir;

      switchDirection(savedDir, false);
      switchMode(savedMode, false);

      updatePageDisplay();
  });

  // 切换阅读方向 (ltr / rtl)
  function switchDirection(dir, showMsg = true) {
      currentDir = dir;
      localStorage.setItem('comic-dir', dir);

      if (dir === 'rtl') {
          document.body.classList.remove('dir-ltr');
          document.body.classList.add('dir-rtl');
          if (showMsg) showToast('已设置为：从右向左翻页（日漫）');
      } else {
          document.body.classList.remove('dir-rtl');
          document.body.classList.add('dir-ltr');
          if (showMsg) showToast('已设置为：从左向右翻页');
      }
  }

  // 切换阅读模式 (scroll / page)
  function switchMode(mode, showMsg = true) {
      currentMode = mode;
      localStorage.setItem('comic-mode', mode);

      if (mode === 'scroll') {
          container.classList.remove('mode-page');
          container.classList.add('mode-scroll');
          pages.forEach(img => img.classList.remove('active'));
          window.addEventListener('scroll', handleScrollProgress);
          handleScrollProgress();
      } else {
          container.classList.remove('mode-scroll');
          container.classList.add('mode-page');
          window.removeEventListener('scroll', handleScrollProgress);
          showPage(currentPage);
      }
      if (showMsg) {
          showToast(mode === 'scroll' ? '已切换至 卷轴/条漫模式' : '已切换至 单页/翻页模式');
      }
  }

  // 点击左右两侧热区的响应逻辑
  function handleZoneClick(zone) {
      if (currentDir === 'ltr') {
          // 左=上一页，右=下一页
          if (zone === 'left') prevPage();
          else nextPage();
      } else {
          // 右向左（日漫）：右=上一页，左=下一页
          if (zone === 'right') prevPage();
          else nextPage();
      }
  }

  // 翻页逻辑
  function nextPage() {
      if (currentMode === 'page') {
          if (currentPage < totalPages) showPage(currentPage + 1);
          else showToast('已经是最后一页了');
      } else {
          window.scrollBy({ top: window.innerHeight * 0.8, behavior: 'smooth' });
      }
  }

  function prevPage() {
      if (currentMode === 'page') {
          if (currentPage > 1) showPage(currentPage - 1);
          else showToast('已经是第一页了');
      } else {
          window.scrollBy({ top: -window.innerHeight * 0.8, behavior: 'smooth' });
      }
  }

  // 显示指定页
  function showPage(index) {
      if (index < 1) index = 1;
      if (index > totalPages) index = totalPages;

      currentPage = index;
      pages.forEach((img, idx) => {
          if (idx === currentPage - 1) {
              img.classList.add('active');
          } else {
              img.classList.remove('active');
          }
      });

      updatePageDisplay();
      window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // 卷轴模式滚动监听
  function handleScrollProgress() {
      if (currentMode !== 'scroll') return;

      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const scrollPercent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;

      progressBar.style.width = scrollPercent + '%';

      let currentViewIndex = 1;
      pages.forEach((img, idx) => {
          const rect = img.getBoundingClientRect();
          if (rect.top <= window.innerHeight / 2) {
              currentViewIndex = idx + 1;
          }
      });
      currentPage = currentViewIndex;
      pageNumSpan.textContent = currentPage;
  }

  // 更新进度与页码
  function updatePageDisplay() {
      pageNumSpan.textContent = currentPage;
      if (currentMode === 'page') {
          const percent = (currentPage / totalPages) * 100;
          progressBar.style.width = percent + '%';
      }
  }

  // 点击页面中间区域隐藏/显示工具栏
  function handleContainerClick(e) {
      barsVisible = !barsVisible;
      if (barsVisible) {
          document.body.classList.remove('bar-hidden');
      } else {
          document.body.classList.add('bar-hidden');
      }
  }

  // 全屏
  function toggleFullscreen() {
      if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
              showToast(`无法全屏: ${err.message}`);
          });
      } else {
          if (document.exitFullscreen) document.exitFullscreen();
      }
  }

  // 快捷键配置（支持按方向自动匹配键盘左右键）
  document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;

      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          // 如果是从右向左，按右箭头/D键是看上/前一页（日漫逻辑）
          if (currentDir === 'rtl') prevPage();
          else nextPage();
      } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          if (currentDir === 'rtl') nextPage();
          else prevPage();
      } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
      } else if (e.key === 'm' || e.key === 'M') {
          const newMode = currentMode === 'scroll' ? 'page' : 'scroll';
          modeSelect.value = newMode;
          switchMode(newMode);
      }
  });

  // Toast
  function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => {
          toast.style.opacity = '0';
      }, 2000);
  }
</script>

</body>
</html>
