<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Reader | Merlyn Archive</title>
  <link rel="stylesheet" href="comic.css">
</head>

<body>

  <header class="reader-header">
    <div class="header-info">
      <div id="archive-label">ARCHIVE / COMIC</div>
      <h1 id="comic-title">Loading...</h1>
      <p id="chapter-title"></p>
    </div>

    <!-- RTL 阅读提示徽章 -->
    <div id="rtl-badge" class="rtl-badge">
      <span class="badge-icon">◀</span> 从右往左阅读 (RTL)
    </div>

    <div class="controls">
      <button id="fullscreen" type="button">全屏</button>
    </div>
  </header>

  <!-- 首次进入阅读器时的引导遮罩提示 -->
  <div id="rtl-toast" class="rtl-toast">
    <div class="toast-content">
      <div class="toast-arrows">
        <span class="arrow-next">◀ 点击左侧 / 左箭头：下一页</span>
        <span class="arrow-prev">点击右侧 / 右箭头：上一页 ▶</span>
      </div>
      <p>习惯：从右向左阅读</p>
    </div>
  </div>

  <main id="comic-container">
    <!-- JS 动态载入当前页图片 -->
  </main>

  <script src="comic.js"></script>
</body>

</html>
